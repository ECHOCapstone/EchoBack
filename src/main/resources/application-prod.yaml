spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: echo-prod-pool
  # 스키마는 Flyway 가 관리한다. 운영 DB 는 V1 로 baseline 후 V2+ 마이그레이션만 적용된다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    time-zone: UTC
  web:
    error:
      include-stacktrace: never

logging:
  level:
    root: INFO
    com.capstoneecho: INFO
  pattern:
    dateformat: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins:
      - ${APP_CORS_ALLOWED_ORIGIN:https://echo.example.com}
  model-server:
    # 운영 환경에서는 default 없이 강제 — 미설정 시 부팅 자체가 실패해 잘못된 fallback 호출을 막는다.
    base-url: ${MODEL_SERVER_BASE_URL}
    # 모델 서버는 /g2p (canonical 시드) + /transcribe (오디오 → ARPABET) 를 노출한다. canonical 캐시 hit
    # 일반 경로는 /transcribe 만 호출하지만, 운영 워밍업 직후엔 30s 도 짧다. 60s 로 둔다.
    timeout-ms: ${MODEL_SERVER_TIMEOUT_MS:60000}
  llm:
    # 운영에서는 LLM 활성 여부와 무관하게 키 만 환경변수로 받는다 — Gemini 활성 시 누락하면 부팅 시점에 거절.
    gemini:
      api-key: ${GEMINI_API_KEY}
  storage:
    local-root: ${APP_STORAGE_LOCAL_ROOT:/var/echo/storage}
