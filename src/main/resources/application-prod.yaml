spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: echo-prod-pool
  # 스키마는 Flyway 가 관리한다. 운영 DB 는 V1 로 baseline 후 V2+ 마이그레이션만 적용된다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    time-zone: UTC
  web:
    error:
      include-stacktrace: never

logging:
  level:
    root: INFO
    com.capstoneecho: INFO
  pattern:
    dateformat: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins:
      - ${APP_CORS_ALLOWED_ORIGIN:https://echo.example.com}
  model-server:
    base-url: ${MODEL_SERVER_BASE_URL}
  storage:
    local-root: ${APP_STORAGE_LOCAL_ROOT:/var/echo/storage}
