spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: "jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  jackson:
    time-zone: Asia/Seoul

app:
  jwt:
    secret: "test-jwt-secret-please-replace-and-make-this-very-long-1234567890"
    expiration-ms: 3600000
  cors:
    allowed-origins:
      - "http://localhost:3000"
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    exposed-headers:
      - Authorization
    allow-credentials: true
    max-age-sec: 3600
  model-server:
    base-url: "http://localhost:8000"
    timeout-ms: 5000
  llm:
    provider: rule-based
  storage:
    local-root: build/test-storage
  tts:
    provider: local-stub
  stats:
    zone: Asia/Seoul
  auth:
    demo-google:
      email: "demo.google@echo.test"
      nickname: "DemoGoogleUser"
