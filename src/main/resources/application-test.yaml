spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: "jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""
  # 테스트는 H2 이므로 Flyway(MySQL 마이그레이션) 를 끄고 Hibernate 가 스키마를 만든다.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    # dialect 는 Hibernate 가 connection 으로부터 자동 감지한다.
    # 로컬: H2 → H2Dialect, CI(application-ci.yaml 머지): MySQL → MySQLDialect.
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "test-google-client-id"
            client-secret: "test-google-client-secret"
            redirect-uri: "{baseUrl}/api/auth/oauth2/{registrationId}/callback"
            scope:
              - openid
              - email
              - profile
          kakao:
            client-id: "test-kakao-client-id"
            client-secret: "test-kakao-client-secret"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/auth/oauth2/{registrationId}/callback"
            scope:
              - openid
              - profile_nickname
              - account_email
            client-name: Kakao
        provider:
          # 테스트 부팅 시 카카오 OIDC discovery 네트워크 호출을 피하기 위해 issuer-uri 대신 명시 URI 를 둔다.
          # 실제 호출은 어차피 테스트 흐름에서 발생하지 않으므로 host 자체는 prod 값을 그대로 둬도 무해.
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v1/oidc/userinfo
            user-name-attribute: sub
            jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json

app:
  jwt:
    secret: "test-jwt-secret-please-replace-and-make-this-very-long-1234567890"
    expiration-ms: 3600000
  model-server:
    timeout-ms: 5000
  # 테스트는 외부 모델 서버 없이 결정적으로 도는 더미 mp3 클라이언트를 강제한다.
  tts:
    provider: local-stub
  storage:
    local-root: build/test-storage
  # 테스트는 프로젝트 data/ 의 실제 편집본에 오염되지 않도록 build 하위를 쓴다.
  content:
    dir: build/test-content
  oauth2:
    frontend-redirect-uri: "http://localhost:3000/oauth/callback"
    frontend-error-uri: "http://localhost:3000/login"
    frontend-signup-uri: "http://localhost:3000/signup"
