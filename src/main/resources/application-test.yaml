spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: "jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

app:
  jwt:
    secret: "test-jwt-secret-please-replace-and-make-this-very-long-1234567890"
    expiration-ms: 3600000
  model-server:
    timeout-ms: 5000
  storage:
    local-root: build/test-storage
  auth:
    demo-google:
      email: "demo.google@echo.test"
