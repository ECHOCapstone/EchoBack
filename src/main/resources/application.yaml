spring:
  application:
    name: ECHO_back
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  jackson:
    time-zone: Asia/Seoul
  # ---- MySQL 영속 저장소 -----------------------------------------------
  # 자격증명은 환경변수로만 받는다 (.env.local 또는 운영 secret manager).
  # 디폴트 URL 은 로컬 dev 셋업 (mysql + Asia/Seoul + utf8mb4) 에 맞춰 둔다.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/echo?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:echo}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      pool-name: EchoHikariPool
  # Flyway 가 db/migration/V*.sql 으로 스키마를 관리하고, JPA 는 매핑 검증만 한다 (production-safe).
  # 로컬 첫 부팅에서 V1~V5 가 자동 적용되며 flyway_schema_history 가 만들어진다.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            # 콜백 경로를 프로젝트 컨벤션 (/api/auth/oauth2/{registrationId}/<action>) 에 맞춤.
            # SecurityConfig.loginProcessingUrl 과 같이 맞춰야 하며, Google Cloud Console 의
            # Authorized redirect URI 도 이 패턴으로 등록돼 있어야 한다.
            # 운영 환경에선 백엔드 host 가 prod 도메인이라 {baseUrl} 자동 치환이 자연스럽지만,
            # 컨테이너 8080 포트를 호스트에 노출하지 못하는 dev 환경에서는 프론트 origin 으로
            # 강제 고정한다. vite proxy 가 /api/* 를 백엔드로 forward 하므로 동일 origin 으로
            # 흐름이 닫힌다. APP_OAUTH2_REDIRECT_URI 환경변수로 운영 시 override 가능.
            redirect-uri: ${APP_OAUTH2_REDIRECT_URI:http://localhost:5173/api/auth/oauth2/{registrationId}/callback}
            scope:
              - openid
              - email
              - profile
          kakao:
            client-id: ${KAKAO_REST_API_KEY:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            # 카카오 token endpoint 는 client_secret_post 단일 지원. Spring 기본값(client_secret_basic)
            # 으로 두면 토큰 교환이 invalid_client 로 실패한다.
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${APP_OAUTH2_REDIRECT_URI:http://localhost:5173/api/auth/oauth2/{registrationId}/callback}
            scope:
              # ID Token 발급 트리거. 콘솔의 "OpenID Connect 활성화" 토글이 ON 이어야 실제로 id_token 이 내려온다.
              - openid
              - profile_nickname
              - account_email
            client-name: Kakao
        provider:
          kakao:
            # issuer-uri 한 줄로 authorization / token / userinfo / jwks endpoint 가 OIDC discovery 로 자동 해소된다.
            # 부팅 시 https://kauth.kakao.com/.well-known/openid-configuration 호출이 발생하므로 오프라인 CI 에서는 주의.
            issuer-uri: https://kauth.kakao.com

app:
  # 부팅 시 이 username 계정을 관리자로 승격한다. 미설정 시 승격 없음.
  admin:
    bootstrap-username: ${APP_ADMIN_BOOTSTRAP_USERNAME:}
    # 시드 관리자 계정 — 시연/평가용. 네 필드가 모두 채워지면 부팅 시 자동으로 만들어진다 (멱등).
    seed:
      username: ${APP_ADMIN_SEED_USERNAME:}
      email: ${APP_ADMIN_SEED_EMAIL:}
      password: ${APP_ADMIN_SEED_PASSWORD:}
      nickname: ${APP_ADMIN_SEED_NICKNAME:관리자}
  jwt:
    expiration-ms: 86400000
  cors:
    allowed-origins:
      - "http://localhost:3000"
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - Authorization
    allow-credentials: true
    max-age-sec: 3600
  model-server:
    base-url: "http://localhost:8001"
    timeout-ms: 10000
  llm:
    # rule-based (기본, 외부 호출 없음) | gemini (Google Generative AI 호출)
    provider: ${APP_LLM_PROVIDER:rule-based}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      # 구조화 출력 지원 모델 중 가장 저렴한 옵션. gemini-3.5-flash 로 올리면 품질 ↑ / 비용 ↑.
      model: ${APP_LLM_GEMINI_MODEL:gemini-3.1-flash-lite}
      base-url: https://generativelanguage.googleapis.com
      timeout-ms: 10000
      # 어드민이 고를 수 있는 모델 후보. 구조화 출력을 지원하는 모델만 둔다.
      models:
        - gemini-3.1-flash-lite
        - gemini-3.1-flash
        - gemini-2.5-flash
        - gemini-2.0-flash
  storage:
    local-root: build/local-storage
  content:
    # 어드민이 편집하는 콘텐츠(프롬프트 편집본)가 저장되는 쓰기 가능 디렉터리.
    # classpath:content/ 는 git 으로 관리되는 공장 기본값이고, 편집본은 여기에 파일로 쌓여
    # 재시작 후에도 유지된다. reset 은 이 파일을 지워 기본값으로 되돌린다.
    dir: ${APP_CONTENT_DIR:data/content}
  tts:
    # local-stub (외부 호출 없음, 더미 mp3) | model-server (gTTS 진짜 음성을 모델 서버에서 합성)
    provider: ${APP_TTS_PROVIDER:model-server}
  stats:
    zone: Asia/Seoul
    badges:
      - id: FIRST_FEEDBACK
        name: "첫 피드백"
        condition: COMPLETED_FEEDBACK_COUNT
        threshold: 1
      - id: STREAK_7
        name: "7일 연속 학습"
        condition: USER_STREAK
        threshold: 7
  oauth2:
    # Google 로그인 성공 후 프론트엔드로 보낼 URL. JWT 는 fragment (#token=...) 로 붙는다.
    frontend-redirect-uri: ${APP_OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:3000/oauth/callback}
    # 실패 시 프론트엔드 로그인 페이지로 redirect. ?oauthError=<code> 쿼리가 붙는다.
    frontend-error-uri: ${APP_OAUTH2_FRONTEND_ERROR_URI:http://localhost:3000/login}
    # 신규 사용자를 가입 폼으로 안내할 URL. fragment 로 #pendingToken=...&email=...&nicknameHint=...&provider=... 가 붙는다.
    frontend-signup-uri: ${APP_OAUTH2_FRONTEND_SIGNUP_URI:http://localhost:5173/signup}
  gamification:
    completion-exp: 10
    streak-cap: 7
    daily-recommended: 3
    weekly-top-n: 5
    weekly-window-days: 7
    score-fallback-on-error: 70.0
    pass-threshold: 80.0
    prior-attempts-cap: 10
    default-ranking-unit-title: "오늘의 랭킹"
    default-practice-word: "the"
  messages:
    recording-guidance-fallback: "발음을 더 또렷하게 따라 읽어 보세요."
    feedback-guidance-fallback: "꾸준한 연습이 발음 개선에 도움이 됩니다."
    retry-guidance-fallback: "해당 단어를 한 번 더 천천히 따라 읽어 보세요."
    upload-too-large: "업로드 가능한 파일 크기를 초과했습니다."
    tts-text-required: "text 는 비어 있을 수 없습니다."
