spring:
  application:
    name: ECHO_back
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  jackson:
    time-zone: Asia/Seoul
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            # 콜백 경로를 프로젝트 컨벤션 (/api/auth/oauth2/{registrationId}/<action>) 에 맞춤.
            # SecurityConfig.loginProcessingUrl 과 같이 맞춰야 하며, Google Cloud Console 의
            # Authorized redirect URI 도 이 패턴으로 등록돼 있어야 한다.
            # 운영 환경에선 백엔드 host 가 prod 도메인이라 {baseUrl} 자동 치환이 자연스럽지만,
            # 컨테이너 8080 포트를 호스트에 노출하지 못하는 dev 환경에서는 프론트 origin 으로
            # 강제 고정한다. vite proxy 가 /api/* 를 백엔드로 forward 하므로 동일 origin 으로
            # 흐름이 닫힌다. APP_OAUTH2_REDIRECT_URI 환경변수로 운영 시 override 가능.
            redirect-uri: ${APP_OAUTH2_REDIRECT_URI:http://localhost:5173/api/auth/oauth2/{registrationId}/callback}
            scope:
              - openid
              - email
              - profile

app:
  jwt:
    expiration-ms: 86400000
  cors:
    allowed-origins:
      - "http://localhost:3000"
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    exposed-headers:
      - Authorization
    allow-credentials: true
    max-age-sec: 3600
  model-server:
    base-url: "http://localhost:8001"
    timeout-ms: 10000
  llm:
    # rule-based (기본, 외부 호출 없음) | gemini (Google Generative AI 호출)
    provider: ${APP_LLM_PROVIDER:rule-based}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      # 구조화 출력 지원 모델 중 가장 저렴한 옵션. gemini-3.5-flash 로 올리면 품질 ↑ / 비용 ↑.
      model: ${APP_LLM_GEMINI_MODEL:gemini-3.1-flash-lite}
      base-url: https://generativelanguage.googleapis.com
      timeout-ms: 10000
  storage:
    local-root: build/local-storage
  tts:
    # local-stub (외부 호출 없음, 더미 mp3) | model-server (gTTS 진짜 음성을 모델 서버에서 합성)
    provider: ${APP_TTS_PROVIDER:model-server}
  stats:
    zone: Asia/Seoul
    badges:
      - id: FIRST_FEEDBACK
        name: "첫 피드백"
        condition: COMPLETED_FEEDBACK_COUNT
        threshold: 1
      - id: STREAK_7
        name: "7일 연속 학습"
        condition: USER_STREAK
        threshold: 7
  auth:
    demo-google:
      email: "demo.google@echo.local"
      nickname: "DemoGoogleUser"
  oauth2:
    # Google 로그인 성공 후 프론트엔드로 보낼 URL. JWT 는 fragment (#token=...) 로 붙는다.
    frontend-redirect-uri: ${APP_OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:3000/oauth/callback}
    # 실패 시 프론트엔드 로그인 페이지로 redirect. ?oauthError=<code> 쿼리가 붙는다.
    frontend-error-uri: ${APP_OAUTH2_FRONTEND_ERROR_URI:http://localhost:3000/login}
  gamification:
    completion-exp: 10
    streak-cap: 7
    daily-recommended: 3
    weekly-top-n: 5
    weekly-window-days: 7
    score-fallback-on-error: 70.0
    pass-threshold: 80.0
    prior-attempts-cap: 10
    default-ranking-unit-title: "오늘의 랭킹"
    default-practice-word: "the"
  messages:
    recording-guidance-fallback: "발음을 더 또렷하게 따라 읽어 보세요."
    feedback-guidance-fallback: "꾸준한 연습이 발음 개선에 도움이 됩니다."
    retry-guidance-fallback: "해당 단어를 한 번 더 천천히 따라 읽어 보세요."
    upload-too-large: "업로드 가능한 파일 크기를 초과했습니다."
    tts-text-required: "text 는 비어 있을 수 없습니다."
