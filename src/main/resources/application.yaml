# Cloudflare Tunnel / 리버스 프록시 뒤에서도 OAuth redirect 와 Spring 의 {baseUrl} placeholder 가
# 외부 도메인을 기준으로 합성되도록 X-Forwarded-* 헤더를 처리한다. 직접 백엔드에 들어오는 요청에는
# X-Forwarded-* 가 없으므로 영향이 없다.
server:
  forward-headers-strategy: framework

spring:
  application:
    name: ECHO_back
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  jackson:
    time-zone: Asia/Seoul
  # ---- MySQL 영속 저장소 -----------------------------------------------
  # 자격증명은 환경변수로만 받는다 (.env.local 또는 운영 secret manager).
  # 디폴트 URL 은 로컬 dev 셋업 (mysql + Asia/Seoul + utf8mb4) 에 맞춰 둔다.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/echo?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:echo}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      pool-name: EchoHikariPool
  # Flyway 가 db/migration/V*.sql 으로 스키마를 관리하고, JPA 는 매핑 검증만 한다 (production-safe).
  # 로컬 첫 부팅에서 V1~V5 가 자동 적용되며 flyway_schema_history 가 만들어진다.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Seoul
          # PronunciationFeedback 의 PhonemeError 자식 N건 + 종합 피드백 INSERT 가 한 트랜잭션 안에서
          # 발생한다. batch_size 를 켜면 N+1 INSERT 가 한 번의 JDBC 라운드트립으로 묶여 처리량이 크게 는다.
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # SQL 안에서 ${...} 를 placeholder 로 해석하지 않는다. 우리는 마이그레이션에 외부 값을 끼우지 않으며,
    # 주석에 들어간 ${app.content.dir} 같은 표기 때문에 Flyway 가 부팅을 거부하는 일을 막는다.
    placeholder-replacement: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            # 콜백 경로를 프로젝트 컨벤션 (/api/auth/oauth2/{registrationId}/<action>) 에 맞춤.
            # SecurityConfig.loginProcessingUrl 과 같이 맞춰야 하며, Google Cloud Console 의
            # Authorized redirect URI 도 이 패턴으로 등록돼 있어야 한다.
            # 운영 환경에선 백엔드 host 가 prod 도메인이라 {baseUrl} 자동 치환이 자연스럽지만,
            # 컨테이너 8080 포트를 호스트에 노출하지 못하는 dev 환경에서는 프론트 origin 으로
            # 강제 고정한다. vite proxy 가 /api/* 를 백엔드로 forward 하므로 동일 origin 으로
            # 흐름이 닫힌다. APP_OAUTH2_REDIRECT_URI 환경변수로 운영 시 override 가능.
            redirect-uri: ${APP_OAUTH2_REDIRECT_URI:{baseUrl}/api/auth/oauth2/{registrationId}/callback}
            scope:
              - openid
              - email
              - profile
          kakao:
            client-id: ${KAKAO_REST_API_KEY:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            # 카카오 token endpoint 는 client_secret_post 단일 지원. Spring 기본값(client_secret_basic)
            # 으로 두면 토큰 교환이 invalid_client 로 실패한다.
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${APP_OAUTH2_REDIRECT_URI:{baseUrl}/api/auth/oauth2/{registrationId}/callback}
            scope:
              # ID Token 발급 트리거. 콘솔의 "OpenID Connect 활성화" 토글이 ON 이어야 실제로 id_token 이 내려온다.
              - openid
              - profile_nickname
              - account_email
            client-name: Kakao
        provider:
          kakao:
            # issuer-uri 한 줄로 authorization / token / userinfo / jwks endpoint 가 OIDC discovery 로 자동 해소된다.
            # 부팅 시 https://kauth.kakao.com/.well-known/openid-configuration 호출이 발생하므로 오프라인 CI 에서는 주의.
            issuer-uri: https://kauth.kakao.com

app:
  # 부팅 시 이 username 계정을 관리자로 승격한다. 미설정 시 승격 없음.
  admin:
    bootstrap-username: ${APP_ADMIN_BOOTSTRAP_USERNAME:}
    # 시드 관리자 계정 — 시연/평가용. 네 필드가 모두 채워지면 부팅 시 자동으로 만들어진다 (멱등).
    seed:
      username: ${APP_ADMIN_SEED_USERNAME:}
      email: ${APP_ADMIN_SEED_EMAIL:}
      password: ${APP_ADMIN_SEED_PASSWORD:}
      nickname: ${APP_ADMIN_SEED_NICKNAME:관리자}
  jwt:
    expiration-ms: 86400000
  cors:
    # 같은 origin (vite proxy + changeOrigin) 흐름에선 CORS 자체가 발생하지 않으므로 평시엔 빈 목록에 가깝다.
    # 다른 origin 에서 직접 호출하는 데모 / 외부 클라이언트를 위해 자기 origin 과 흔한 dev 포트만 허용한다.
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
      - "https://hufs-echo.com"
    # 와일드카드 패턴 (Cloudflare Tunnel 임시 도메인 등). 와일드카드는 allowed-origins 가 아닌
    # allowed-origin-patterns 에 두어야 Spring 이 정규식으로 매칭한다.
    allowed-origin-patterns:
      - "https://*.hufs-echo.com"
      - "https://*.trycloudflare.com"
      - "https://*.loca.lt"
      - "https://*.ngrok-free.app"
      - "https://*.ngrok.app"
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - Authorization
    allow-credentials: true
    max-age-sec: 3600
  model-server:
    base-url: "http://localhost:8001"
    # 모델 서버는 /g2p (canonical 시드용) 와 /transcribe (오디오 → ARPABET) 두 엔드포인트를 노출한다.
    # 일반 채점 경로는 canonical 캐시 hit 이면 /transcribe 만 호출하지만, 캐시 miss + 첫 모델 warm-up
    # 시점에는 10초로는 잦은 타임아웃이 발생한다. 30초까지 늘려 정상 응답이 끊기지 않게 한다.
    timeout-ms: 30000
  recognition:
    # canonical 을 요구하지 않는 모델(baseline·slplab)에서 /transcribe 를 canonical 확보와
    # 병렬 실행하는 전용 풀. 포화 시 호출 스레드가 직접 실행한다(CallerRunsPolicy).
    transcribe-pool-core: 4
    transcribe-pool-max: 16
    transcribe-queue-capacity: 64
    # 모델별 canonical 요구 여부(/models)를 다시 읽기까지의 캐시 수명(ms).
    catalog-cache-ttl-ms: 5000
  llm:
    # rule-based (기본, 외부 호출 없음) | gemini (Google Generative AI 호출)
    provider: ${APP_LLM_PROVIDER:rule-based}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      # 구조화 출력 지원 모델 중 가장 저렴한 옵션. gemini-3.5-flash 로 올리면 품질 ↑ / 비용 ↑.
      model: ${APP_LLM_GEMINI_MODEL:gemini-3.1-flash-lite}
      base-url: https://generativelanguage.googleapis.com
      timeout-ms: 10000
      # 어드민이 고를 수 있는 모델 후보. 구조화 출력 지원 stable 모델.
      #   - flash-lite = 비추론(경량): thinking 토큰이 거의 없어 현재 maxOutputTokens 로 출력이 안 잘림 → 권장.
      #   - flash      = 추론 모델: thinking 이 출력 예산을 잡아먹어, maxOutputTokens 를 넉넉히 둬야 JSON 이
      #                  안 잘린다 (gemini-3.5-flash 를 2048 로 쓰면 MAX_TOKENS 로 폴백됨).
      models:
        - gemini-3.1-flash-lite   # 비추론 · 기본값(권장)
        - gemini-2.5-flash-lite   # 비추론 · 더 저렴
        - gemini-3.5-flash        # 추론 · maxOutputTokens 충분해야 사용 가능
        - gemini-2.5-flash        # 추론 · maxOutputTokens 충분해야 사용 가능
  storage:
    local-root: build/local-storage
  content:
    # 어드민이 편집하는 콘텐츠(프롬프트 편집본)가 저장되는 쓰기 가능 디렉터리.
    # classpath:content/ 는 git 으로 관리되는 공장 기본값이고, 편집본은 여기에 파일로 쌓여
    # 재시작 후에도 유지된다. reset 은 이 파일을 지워 기본값으로 되돌린다.
    dir: ${APP_CONTENT_DIR:data/content}
  tts:
    # local-stub (외부 호출 없음, 더미 mp3) | model-server (gTTS 진짜 음성을 모델 서버에서 합성)
    provider: ${APP_TTS_PROVIDER:model-server}
  stats:
    zone: Asia/Seoul
    badges:
      - id: FIRST_FEEDBACK
        name: "첫 피드백"
        condition: COMPLETED_FEEDBACK_COUNT
        threshold: 1
      - id: STREAK_7
        name: "7일 연속 학습"
        condition: USER_STREAK
        threshold: 7
  oauth2:
    # OAuth 성공/실패/가입 안내의 프론트엔드 redirect 경로. path-only 로 두면 백엔드가 incoming
    # request 의 scheme + host (Cloudflare Tunnel / 리버스 프록시 등 어떤 도메인이든) 와 합성한다.
    # 절대 URL 을 환경변수로 명시하면 그 host 는 무시되고 path/query 만 사용된다.
    frontend-redirect-uri: ${APP_OAUTH2_FRONTEND_REDIRECT_URI:/oauth/callback}
    frontend-error-uri: ${APP_OAUTH2_FRONTEND_ERROR_URI:/login}
    frontend-signup-uri: ${APP_OAUTH2_FRONTEND_SIGNUP_URI:/signup}
  gamification:
    completion-exp: 10
    streak-cap: 7
    daily-recommended: 3
    # 통계 화면에서 사용하는 주간 윈도 일수 / 상위 노출 개수. 챌린지 랭킹과는 무관하다.
    weekly-top-n: 5
    weekly-window-days: 7
    # 단어 / 문장 통과 점수 임계. ScoringService 가 alignment 와 약점 음소 정책으로 0~100 점수를
    # 산출하고, 이 값 이상이면 통과로 판정한다.
    pass-threshold: 75.0
    prior-attempts-cap: 10
    default-practice-word: "the"
  challenge:
    # 사용자가 활성 챌린지에 도전할 수 있는 하루 최대 횟수 (Asia/Seoul 자정 경계).
    # best 점수만 랭킹에 반영되지만, 무제한 시도를 두면 UI 가 길어지고 모델 서버 부하가 누적된다.
    daily-attempt-limit: 5
    # 랭킹 상위 노출 인원 수. FE 카드의 미니뷰 / 상세 모두 동일 값을 쓴다.
    top-n: 5
    # 등수별 배지 식별자. 챌린지 종료 시점에 자동 발급된다. 빈 값으로 두면 그 등수는 배지 없음.
    rank-badge:
      gold-id: "CHALLENGE_GOLD"
      silver-id: "CHALLENGE_SILVER"
      bronze-id: "CHALLENGE_BRONZE"
  auth:
    # 회원가입 시 적용되는 비밀번호 정책. 백엔드 검증과 프론트 안내가 같은 출처를 공유한다.
    password-policy:
      min-length: 8
      max-length: 100
      # 다음 문자 종류 중 require-categories 개수 이상을 만족해야 한다.
      # categories: lowercase, uppercase, digit, symbol
      require-categories: 2
  legal:
    # 현재 약관 본문 버전. 본문 파일은 classpath:content/terms/{kind}-{version}.md 로 둔다.
    # 버전이 바뀌면 동의 기록과 비교해 재동의를 요구할 수 있다.
    terms-version: "1"
  member:
    retention:
      # 탈퇴 처리 후 hard delete 까지 보존할 일수. 같은 자격증명으로 다시 로그인하면 복구 가능.
      # UserRetentionScheduler 가 매일 한 번 deleted_at 가 이 일수보다 오래된 사용자를 정리한다.
      grace-days: 30
  messages:
    recording-guidance-fallback: "발음을 더 또렷하게 따라 읽어 보세요."
    feedback-guidance-fallback: "꾸준한 연습이 발음 개선에 도움이 됩니다."
    retry-guidance-fallback: "해당 단어를 한 번 더 천천히 따라 읽어 보세요."
    upload-too-large: "업로드 가능한 파일 크기를 초과했습니다."
    tts-text-required: "text 는 비어 있을 수 없습니다."
  scoring:
    # 길이 정규화 + 자질거리 가중 채점: score = 100 × (1 − Σ오류가중치 / canonical 길이).
    # 한국인 학습자 약점 음소 — 자질상 가까운 치환/삭제도 weak-multiplier 로 가중한다.
    weak-phonemes: [V, R, L, TH, DH, F, Z, ZH, AH, AE, ER]
    weak-multiplier: 1.5        # 약점 음소 오류 가중 배수
    substitution-weight: 1.0    # 자질거리 1.0(최대) 치환 1개의 기준 가중치
    deletion-weight: 1.0        # 삭제 1개 가중치
    insertion-weight: 0.5       # 삽입 1개 가중치 (치환/삭제보다 가볍게)
    distance-floor: 0.3         # 치환 자질거리 하한 (R/L 처럼 가까운 치환도 최소 이만큼은 오류)
  canonical:
    # 부팅 시 콘텐츠 (steps / sentences / challenges) 의 누락된 canonical 을 비동기 backfill.
    # 시드 직후 첫 부팅 / 모델 정책 변경 직후 한 번 켜고 끄는 운영 토글.
    bootstrap-on-startup: ${APP_CANONICAL_BOOTSTRAP:false}
    bootstrap-page-size: 50
