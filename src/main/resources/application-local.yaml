spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/echo?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false"
    username: echo
    password: echo
  # 스키마는 Flyway 가 관리한다. 기존 DB(직접/Hibernate 로 생성)는 V1 로 baseline 후 V2+ 만 적용된다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    secret: "local-jwt-secret-please-replace-with-something-long-and-random-1234567890"
