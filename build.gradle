plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
}

group = 'com.capstoneecho'
version = '0.0.1-SNAPSHOT'
description = 'ECHO_back'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('snippetsDir', file("build/generated-snippets"))
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    // Spring Boot 4 부터 Flyway autoconfig 가 spring-boot-flyway 모듈로 분리됐다.
    // 이게 없으면 spring.flyway.* 가 무시되고 마이그레이션이 실행되지 않는다.
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restdocs'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testAndDevelopmentOnly 'com.h2database:h2' // 로컬 테스트 기본 datasource
    // CI 전용: GitHub Actions 의 SPRING_PROFILES_ACTIVE=test,ci 환경에서만 활성화된다.
    // 로컬 ./gradlew test 는 application-test.yaml 의 H2 설정을 그대로 사용한다.
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    outputs.dir snippetsDir
    useJUnitPlatform()
    finalizedBy jacocoTestReport

    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStackTraces true
    }

    // 표준 출력/에러는 기본적으로 삼키되, 실패한 테스트에 한해서만 콘솔로 흘린다.
    // (전역 showStandardStreams = true 는 통과 테스트 로그까지 쏟아져 CI 로그가 비대해지므로
    //  테스트별 출력을 버퍼링했다가 실패 시에만 flush 한다.)
    def perTestOutput = new java.util.concurrent.ConcurrentHashMap<String, StringBuilder>()
    onOutput { descriptor, event ->
        perTestOutput.computeIfAbsent(descriptor.toString()) { new StringBuilder() }
                .append(event.message)
    }
    afterTest { descriptor, result ->
        def buffered = perTestOutput.remove(descriptor.toString())
        if (buffered != null && result.resultType == TestResult.ResultType.FAILURE) {
            println "--- stdout/stderr: ${descriptor} ---"
            print buffered.toString()
            println "--- end: ${descriptor} ---"
        }
    }
}

// ---- JaCoCo coverage gate ------------------------------------------------
//
// Java 25 class files (major 69) require JaCoCo 0.8.13+. Gradle 9.4.x ships
// an older default tool version, so pin explicitly.
jacoco {
    toolVersion = "0.8.13"
}

// Exclusions: Lombok-generated boilerplate (DTOs / JPA entities), Spring
// configuration glue, the application bootstrap class, external HTTP adapters
// whose covered paths require live third-party endpoints, and static catalogs
// that are essentially data definitions wrapped in Java. These carry few
// instructions of real logic — coverage on them is noise, not signal.
def jacocoExcludePatterns = [
        '**/EchoBackApplication.*',
        '**/dto/**',
        '**/entity/**',
        '**/global/config/**',
        '**/external/llm/GeminiLlmClient*',
        '**/external/llm/GeminiCallExecutor*',
        '**/external/llm/LlmJsonSchemas*',
        '**/external/llm/translation/GeminiTranslationClient*',
        '**/external/modelserver/ModelServerClient*',
        '**/external/modelserver/HttpClientConfig*',
        '**/pronunciation/tts/support/ModelServerTtsClient*',
        '**/statistics/badges/BadgeRegistry*',
        '**/legal/LegalTermsRegistry*',
]

tasks.named('jacocoTestReport') {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// 게이트는 현재 hot-path 서비스 (FeedbackService / AuthService / ChallengeHistoryService / ProgressService /
// PendingOAuthTokenService 등) 의 단위 테스트가 부족해 현실값에 맞춰 0.70 으로 둔다. 캐노니컬 도메인은 이번
// 작업에서 직접 추가됐고 테스트가 따라붙었으므로 회귀 방지 효과가 있다.
// TODO: 위 hot-path 서비스에 단위 테스트를 보강하며 단계적으로 0.80 까지 끌어올린다.
tasks.named('jacocoTestCoverageVerification') {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}

// `classDirectories` resolution needs the source sets to be fully wired, so
// apply exclusions in a project-level afterEvaluate hook rather than inline
// inside each task configuration block (Task has no afterEvaluate).
project.afterEvaluate {
    [jacocoTestReport, jacocoTestCoverageVerification].each { jt ->
        jt.classDirectories.setFrom(
                files(jt.classDirectories.files.collect {
                    fileTree(dir: it, exclude: jacocoExcludePatterns)
                })
        )
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

// ---- REST Docs → Asciidoctor → single HTML --------------------------------
tasks.named('asciidoctor') {
    inputs.dir snippetsDir
    dependsOn test
    attributes 'snippets': snippetsDir,
            'source-highlighter': 'highlightjs',
            'toc': 'left',
            'toclevels': '3',
            'sectlinks': '',
            'sectnums': ''
}
