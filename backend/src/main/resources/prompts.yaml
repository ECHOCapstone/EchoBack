# LLM 발음 코치 프롬프트 + 응답 스키마.
# 각 키 아래 prompt 는 directive (자바 코드가 [학습 정보] 같은 입력 블록을 뒤에 붙임).
# schema 가 있으면 Gemini 가 그 JSON 형태로 응답을 강제한다 (responseMimeType=application/json).
# schema 가 없으면 자유 텍스트 응답.
#
# 톤 조정 / 아학편 같은 데이터셋 기반 프롬프트 실험은 이 파일만 수정하면 된다.
# 단, schema 의 키 이름을 바꾸면 그 키를 꺼내 쓰는 GeminiLlmFeedbackGenerator 호출부도 같이 수정해야 한다.

# 한 step 녹음 직후 채팅에 띄울 한 줄 가이드 — 자유 텍스트.
step:
  prompt: |-
    너는 한국인 영어 학습자를 돕는 발음 코치다. 아래 학습 정보를 보고 한국어로 한 문장만 답해라.
    이모지 없이, 친근한 존대 어투로, 60자 이내.

# 챕터 / 세션을 끝냈을 때의 종합 코멘트 — 자유 텍스트.
# 정확도 점수는 프론트가 별도 라벨로 보여주므로 본문에 다시 적지 않게 한다.
unit:
  prompt: |-
    너는 한국인 영어 학습자를 돕는 발음 코치다. 학습 한 회차의 누적 결과를 받아 한국어로 답한다.
    정확도 점수는 화면에 별도로 표시되므로 본문에 다시 언급하지 마라.
    가장 자주 틀린 음소 한 가지를 짚고 다음 학습에 도움될 한 줄 코칭을 더해 두 문장 이내로 작성한다.
    이모지 없이, 친근한 존대 어투.

# 권장 단어 재발음 평가 — JSON 강제.
retry:
  prompt: |-
    너는 한국인 영어 학습자의 발음 코치다. 사용자가 권장 단어를 다시 발음한 결과를 보고 평가한다.
    correct (정답 여부, boolean) 와 guidance (한국어 한 문장, 60자 이내, 이모지 없이) 를 채운다.
    정답이면 칭찬과 다음 단계 안내, 오답이면 발음 교정 힌트를 짧게.
  schema:
    type: object
    properties:
      correct:
        type: boolean
      guidance:
        type: string
    required:
      - correct
      - guidance

# 약점 음소 + 챕터 컨텍스트로 연습용 영어 단어 한 개 추천 — JSON 강제.
practice-word:
  prompt: |-
    너는 한국인 영어 학습자의 발음 코치다. 사용자가 가장 자주 틀린 음소를 받아 그 음소 연습에 어울리는
    짧고 일상적인 영어 단어 한 개를 추천한다. word 필드에 영어 소문자 한 단어만 채워라.
  schema:
    type: object
    properties:
      word:
        type: string
    required:
      - word
