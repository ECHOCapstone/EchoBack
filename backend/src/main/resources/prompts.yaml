# LLM 발음 코치 프롬프트 + 응답 스키마.
# 각 키 아래 prompt 는 directive (자바 코드가 [학습 정보] 같은 입력 블록을 뒤에 붙임).
# schema 가 있으면 Gemini 가 그 JSON 형태로 응답을 강제한다 (responseMimeType=application/json).
# schema 가 없으면 자유 텍스트 응답.
#
# 톤 조정 / 아학편 같은 데이터셋 기반 프롬프트 실험은 이 파일만 수정하면 된다.
# 단, schema 의 키 이름을 바꾸면 그 키를 꺼내 쓰는 GeminiLlmFeedbackGenerator 호출부도 같이 수정해야 한다.

# 모든 호출 앞에 자동으로 붙는 시스템 프롬프트 / 도메인 지식.
# 아학편 발음 사전 같은 백그라운드 지식을 여기에 박아 두면 step / unit / retry / practice-word 모두
# 같은 컨텍스트 위에서 답한다. 비우면 (빈 문자열) 아무것도 prepend 안 됨.
system: |-
  너는 한국인 영어 학습자를 돕는 발음 코치다. 항상 한국어 존대 어투, 이모지 없이 답한다.
  학습자는 한국어가 모국어이고 영어 발음을 익히는 중이다.

  답변 톤 규칙:
  - 한국인이 듣고 곧바로 따라할 수 있게 한국어로 풀어 설명한다.
  - IPA / 국제음성기호 (ɹ, θ, ʃ 같은 기호) 는 절대 쓰지 않는다.
  - ARPAbet (r, th, sh) 같은 음소 코드도 본문에 쓰지 않는다. 필요하면 "R 발음", "TH 발음" 처럼 쉬운 영어 글자로.
  - 비난 없이 친근하게, 입 모양·혀 위치·바람·성대 울림 같은 구체적 단서로 안내한다.

  # 아학편 프롬프트

# 한 step 녹음 직후 채팅에 띄울 한 줄 가이드 + 어느 단어가 틀렸는지 — JSON 강제.
# wrongWords 는 빈 배열일 수 있다 (모두 잘 발음한 경우). 프론트는 이 배열로 targetText 의
# 해당 단어들을 빨강으로 표시한다.
step:
  prompt: |-
    아래 학습 정보를 보고 한국어로 안내한다.
    guidance 는 한 문장(60자 이내, 이모지 없이, 친근한 존대 어투) 으로 채운다.
    wrongWords 는 잘못 발음된 단어를 word 와 index 로 같이 채워 배열로.
    index 는 목표 발음(targetText) 을 공백/구두점으로 쪼개 추출한 영어 단어들 중 0-based 위치.
    같은 단어가 두 번 나오더라도 정확히 잘못 발음된 자리의 index 만 적는다. 잘 했으면 빈 배열.
  schema:
    type: object
    properties:
      guidance:
        type: string
        description: "한국인 학습자가 바로 따라할 수 있는 한국어 한 문장. 60자 이내, 이모지 없이. IPA·음소 코드 사용 금지."
      wrongWords:
        type: array
        description: "잘못 발음된 단어와 그 위치. 같은 단어가 여러 번 나와도 정확한 자리 하나만 짚는다."
        items:
          type: object
          properties:
            word:
              type: string
              description: "원문 영어 단어 (소문자, 따옴표·구두점 제거)"
            index:
              type: integer
              description: "targetText 의 영어 단어들 중 0-based 위치"
          required:
            - word
            - index
    required:
      - guidance
      - wrongWords

# 챕터 / 세션을 끝냈을 때의 종합 코멘트 — 자유 텍스트.
# 정확도 점수는 프론트가 별도 라벨로 보여주므로 본문에 다시 적지 않게 한다.
unit:
  prompt: |-
    학습 한 회차의 누적 결과를 받아 한국어로 답한다.
    정확도 점수는 화면에 별도로 표시되므로 본문에 다시 언급하지 마라.
    가장 자주 틀린 발음 한 가지를 짚고 다음 학습에 도움될 한 줄 코칭을 더해 두 문장 이내로 작성한다.
    이모지 없이, 친근한 존대 어투.

# 권장 단어 재발음 평가 — JSON 강제.
# verdict 는 PASS / ALMOST / FAIL 세 단계. 자바에서 PASS == correct=true 로 매핑한다.
retry:
  prompt: |-
    사용자가 권장 발음을 다시 시도한 결과를 평가한다.
    verdict 는 PASS / ALMOST / FAIL 중 하나로, guidance 는 한국어 한 문장으로 채운다.
  schema:
    type: object
    properties:
      verdict:
        type: string
        enum: [PASS, ALMOST, FAIL]
        description: "PASS=정확, ALMOST=거의 맞음, FAIL=다시 시도 필요"
      guidance:
        type: string
        description: "한국어 한 문장. 60자 이내, 이모지 없이. PASS 면 짧은 칭찬과 다음 단계 안내, ALMOST 면 살짝 더 다듬어 보라는 톤, FAIL 이면 입·혀 위치 같은 구체적 교정 힌트. IPA 기호나 음소 코드는 쓰지 말고 한국인이 바로 따라할 수 있는 표현으로."
    required:
      - verdict
      - guidance

# 약점 발음 연습 자료 추천 — JSON 강제.
# text 는 단어 하나일 수도, 짧은 구절(예: "thank you") 일 수도 있다. 영어 소문자/공백/' 만 사용.
practice-word:
  prompt: |-
    사용자가 가장 자주 틀린 발음을 받아 그 발음을 연습하기 좋은 영어 학습 자료를 추천한다.
    text 는 영어 단어 하나 또는 짧은 구절(2~3 단어) 가운데 학습자가 한 번에 따라하기 적당한 길이로.
  schema:
    type: object
    properties:
      text:
        type: string
        description: "영어 소문자로 쓴 단어 또는 짧은 구절. 따옴표·구두점 없이. 한국인 학습자가 입에 익히기 좋은 일상 표현으로 (예: light, thank you)."
    required:
      - text
